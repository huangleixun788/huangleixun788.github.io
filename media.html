<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频图片仓库 - 黄雷荀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '微软雅黑', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            padding: 30px 20px;
            transition: 0.3s;
        }
        body.light{
            background: linear-gradient(135deg, #f5f7fa, #e4eaf5);
            color: #222;
        }
        .back-btn{
            display: inline-block;
            padding: 10px 25px;
            background: #e94560;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .container{
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        h1{
            color: #e94560;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(233,69,96,0.7);
        }
        .box{
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin: 20px auto;
            border: 1px solid #333;
        }
        body.light .box{
            background: rgba(0,0,0,0.03);
            border-color: #ddd;
        }
        h2{
            margin-bottom: 20px;
            color: #25f4ee;
        }
        img{
            max-width: 90%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(233,69,96,0.4);
            margin: 10px 0;
        }
        video{
            max-width: 90%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(233,69,96,0.4);
            margin: 10px 0;
        }
        footer{
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回主页按钮 -->
        <a href="index.html" class="back-btn">← 返回个人主页</a>

        <h1>🎬 黄雷荀 视频图片仓库</h1>

        <!-- 图片区域 -->
        <div class="box">
            <h2>🖼️ 图片合集</h2>
            <!-- 在这里加图片 格式：<img src="图片文件名.png"> -->
            <img src="hlx.png" alt="个人头像">
        </div>

        <!-- 视频区域 -->
        <div class="box">
            <h2>🎥 视频合集</h2>
            <!-- 在这里加视频 格式直接复制下面 -->
            <video controls width="800">
                <source src="video.mp4" type="video/mp4">
                你的浏览器不支持视频播放
            </video>
        </div>

        <footer>
            Made with ❤️ 黄雷荀 | 视频图片专用仓库
        </footer>
    </div>

    <script>
        // 同步主页明暗主题
        if(localStorage.getItem('theme') === 'light'){
            document.body.classList.add('light');
        }
    </script>
</body>
</html>
