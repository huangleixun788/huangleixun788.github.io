        * {

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);

            min-height: 100vh;
            display: flex;
            flex-direction: column;

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #e94560;
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        h1 {
            font-size: 3rem;
            color: #e94560;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.7);
        }
        .intro {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #ccc;
        }
        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }
        .douyin-btn {

            color: #fff;
        }

            transform: scale(1.05);
        }
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 2px solid #e94560;
        }
        .modal-content h2 {
            color: #e94560;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;

            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
        }

            color: #25f4ee;
            margin: 15px 0;
            font-size: 1.1rem;
        }
    </style>

</div>

<!-- 登录弹窗 -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('loginModal')">×</span>
        <h2>用户登录</h2>
        <input type="text" id="loginUser" placeholder="输入用户名">
        <input type="password" id="loginPwd" placeholder="输入密码">
        <button class="btn auth-btn" onclick="userLogin()">登录</button>
        <p style="margin-top:10px;">没有账号？<span style="color:#25f4ee;cursor:pointer" onclick="switchModal('regModal')">立即注册</span></p>
    </div>
</div>

<!-- 注册弹窗 -->
<div id="regModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('regModal')">×</span>
        <h2>用户注册</h2>
        <input type="text" id="regUser" placeholder="设置用户名">
        <input type="password" id="regPwd" placeholder="设置密码">
        <input type="password" id="regPwd2" placeholder="确认密码">
        <button class="btn auth-btn" onclick="userRegister()">注册</button>
        <p style="margin-top:10px;">已有账号？<span style="color:#25f4ee;cursor:pointer" onclick="switchModal('loginModal')">立即登录</span></p>
    </div>
</div>

<footer>
    Made with ❤️ by 黄雷荀 | 2026 | 专属个人网站
</footer>

<script>
// 打开弹窗
function openModal(id) {
    document.getElementById(id).style.display = "flex";
}
// 关闭弹窗
function closeModal(id) {
    document.getElementById(id).style.display = "none";
}
// 切换弹窗
function switchModal(id) {
    closeModal('loginModal');
    closeModal('regModal');
    openModal(id);
}

// 注册功能
function userRegister() {
    let user = document.getElementById('regUser').value;
    let pwd = document.getElementById('regPwd').value;
    let pwd2 = document.getElementById('regPwd2').value;

    if(!user || !pwd || !pwd2) {
        alert('请填写完整信息！');
        return;
    }
    if(pwd !== pwd2) {
        alert('两次密码不一致！');
        return;
    }
    // 保存到浏览器本地
    localStorage.setItem('username', user);
    localStorage.setItem('password', pwd);
    alert('注册成功！请登录');
    switchModal('loginModal');
}

// 登录功能
function userLogin() {
    let user = document.getElementById('loginUser').value;
    let pwd = document.getElementById('loginPwd').value;
    
    let localUser = localStorage.getItem('username');
    let localPwd = localStorage.getItem('password');

    if(user === localUser && pwd === localPwd) {
        alert('登录成功！欢迎你，' + user);
        document.getElementById('userInfo').innerText = '当前登录：' + user;
        closeModal('loginModal');
    } else {
        alert('账号或密码错误！');
    }
}

// 页面加载检查登录状态
window.onload = function() {
    let user = localStorage.getItem('username');
    if(user) {
        document.getElementById('userInfo').innerText = '当前登录：' + user;
    }
}
</script>
